name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: windows-tool
        run: pip install pillow pillow-heif pymupdf pyinstaller

      - name: Build exe with PyInstaller
        working-directory: windows-tool
        run: pyinstaller --onefile --windowed --name image_to_jpg image_to_jpg.py

      - name: Build installer with Inno Setup
        working-directory: windows-tool
        run: '& "C:\Program Files (x86)\Inno Setup 6\iscc.exe" setup.iss'
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageToJPG-Setup
          path: windows-tool/Output/ImageToJPG-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windows-tool/Output/ImageToJPG-Setup.exe
          generate_release_notes: false
          body: |
            ## Installation

            1. Download **ImageToJPG-Setup.exe** below
            2. Run it and follow the installer (requires admin)
            3. Right-click any `.heic`, `.heif`, `.webp`, `.png`, or `.pdf` file (or a multi-file selection) → **Convert to JPG**

            Multi-page PDFs are converted to one JPG per page.
            The converted `.jpg`(s) are saved in the same folder as the original.
            EXIF metadata (date taken, GPS location, camera info) is preserved where present.
